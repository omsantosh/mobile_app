name: Build ThaleSmart iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - '.github/workflows/build_ios.yml'

permissions:
  contents: write

jobs:
  build-ios:
    name: Compile & Package iOS IPA
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Xcode Environment
        run: |
          flutter --version
          xcodebuild -version

      - name: Install Flutter Dependencies
        run: |
          flutter pub get

      - name: Build iOS Application (Release Mode, Unsigned)
        run: |
          flutter build ios --release --no-codesign

      - name: Package Payload into ThaleSmart.ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -q ThaleSmart.ipa Payload
          echo "IPA Size:"
          ls -lh ThaleSmart.ipa

      - name: Upload ThaleSmart IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThaleSmart-iOS-IPA
          path: ThaleSmart.ipa
          retention-days: 30

      - name: Publish to Public GitHub Releases (No Login Required to Download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-latest
          name: "ThaleSmart iOS App (IPA)"
          body: "Direct download of unsigned ThaleSmart.ipa for iPhone. Compatible with Sideloadly / AltStore / TestFlight."
          files: ThaleSmart.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
